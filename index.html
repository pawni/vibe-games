<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2030">
<title>Vibe Games</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at 50% 0, #244e62, #0d2030 70%);
  color: #f5fcff;
  font-family: system-ui, sans-serif;
}
main { width: min(100% - 2rem, 44rem); margin: 0 auto; padding: clamp(3rem, 12vh, 8rem) 0; }
h1 { font-size: clamp(2.5rem, 9vw, 5rem); line-height: 1; letter-spacing: -.06em; margin: 0 0 2rem; }
article { background: #173447; border: 1px solid #547a8b; border-radius: 1rem; padding: clamp(1.25rem, 5vw, 2.5rem); }
article + article { margin-top: 1rem; }
h2 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.25rem); }
p { color: #c5dce5; line-height: 1.55; margin: .75rem 0 1.5rem; max-width: 38ch; }
a { display: inline-block; background: #87f4cf; color: #123b40; border-radius: .65rem; padding: .8rem 1.2rem; font-weight: 750; text-decoration: none; }
a:hover { background: #b4ffe6; }
a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1>Vibe Games</h1>
  <article>
    <h2>Swarm Sprint</h2>
    <p>Move between three lanes, rescue gunners and break through waves of mobs. Bank your score before your squad falls.</p>
    <a href="./swarm-sprint/">Play Swarm Sprint</a>
  </article>
  <article>
    <h2>Ridgebreak</h2>
    <p>Carve through a destructible ridge, trigger power-ups mid-volley, and upgrade your castle across six sieges.</p>
    <a href="./ridgebreak/">Play Ridgebreak</a>
  </article>
</main>
</body>
</html>
